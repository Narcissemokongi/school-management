workflows:
  android-build:
    name: Build Android
    max_build_duration: 60
    environment:
      vars:
        NODE_VERSION: "22.11.0"
        JAVA_VERSION: 17
        NAPI_RS_FORCE_WASI: "error"
      node: 22.11.0
      java: 17
      groups:
        - app-env
    scripts:
      - name: Install dependencies
        script: |
          set -e
          echo "=== Node: $(node --version) | Arch: $(uname -m) ==="
          
          # Nettoyage complet
          rm -rf node_modules package-lock.json
          
          # Installation standard (ignore les erreurs de bindings natifs)
          npm install --no-audit --no-fund || true
          
          # ✨ FORCER l'installation du binding WASM
          echo "=== Installation du binding WASM ==="
          npm install --no-save --force @rolldown/binding-wasm32-wasi@1.2.12 || true
          
          # Vérification
          if [ ! -f node_modules/vite/bin/vite.js ]; then
            echo "❌ Vite manquant"; exit 1
          fi
          echo "✅ Vite OK"
          ls node_modules/@rolldown/ 2>/dev/null || echo "(pas de binding natif, WASM utilisé)"
      - name: Build web app
        script: npm run build
      - name: Capacitor sync
        script: npx cap sync android
      - name: Build APK (debug)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients:
          - narcissemokongi@gmail.com

  ios-build:
    name: Build iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.schoolmanagement.app
      vars:
        NODE_VERSION: "22.11.0"
        XCODE_VERSION: 15.4
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        NAPI_RS_FORCE_WASI: "error"
      node: 22.11.0
      xcode: 15.4
      cocoapods: default
      groups:
        - app-env
    scripts:
      - name: Install dependencies
        script: |
          set -e
          echo "=== Node: $(node --version) | Arch: $(uname -m) ==="
          
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund || true
          
          echo "=== Installation du binding WASM ==="
          npm install --no-save --force @rolldown/binding-wasm32-wasi@1.2.12 || true
          
          if [ ! -f node_modules/vite/bin/vite.js ]; then
            echo "❌ Vite manquant"; exit 1
          fi
          echo "✅ Vite OK"
          ls node_modules/@rolldown/ 2>/dev/null || echo "(pas de binding natif, WASM utilisé)"
      - name: Build web app
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Install pods
        script: |
          cd ios/App
          pod install
      - name: Setup code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA (Release, signé)
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - narcissemokongi@gmail.com
        notify:
          success: true
          failure: true

  desktop-build:
    name: Build Desktop
    max_build_duration: 60
    environment:
      vars:
        NODE_VERSION: "22.11.0"
        NAPI_RS_FORCE_WASI: "error"
      node: 22.11.0
      groups:
        - app-env
    scripts:
      - name: Install dependencies
        script: |
          set -e
          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund || true
          npm install --no-save --force @rolldown/binding-wasm32-wasi@1.2.12 || true
          
          if [ ! -f node_modules/vite/bin/vite.js ]; then
            echo "❌ Vite manquant"; exit 1
          fi
      - name: Build web app
        script: npm run build
      - name: Capacitor sync electron
        script: npx cap sync electron
      - name: Package Electron
        script: |
          cd electron
          npm install
          npm run electron:build
    artifacts:
      - electron/release/*.exe
      - electron/release/*.dmg
      - electron/release/*.AppImage
    publishing:
      email:
        recipients:
          - narcissemokongi@gmail.com