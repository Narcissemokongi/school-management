workflows:
  android-build:
    name: Build Android
    max_build_duration: 60
    environment:
      vars:
        NODE_VERSION: "20.19.0"
        JAVA_VERSION: 17
      node: 20.19.0
      java: 17
      groups:
        - app-env
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Capacitor sync
        script: npx cap sync android
      - name: Build APK (debug)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients:
          - narcissemokongi@gmail.com

  ios-build:
    name: Build iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      # ✅ À configurer dans Codemagic → Team integrations → Developer Portal
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.schoolmanagement.app   # ← TON bundle ID
      vars:
        NODE_VERSION: "20.19.0"
        XCODE_VERSION: 15.4
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 20.19.0
      xcode: 15.4
      cocoapods: default
      groups:
        - app-env
    scripts:
      - name: Install dependencies
        script: npm ci
      # ❌ RETIRÉ : npm install @capacitor/ios  (déjà dans package.json)
      # ❌ RETIRÉ : sudo gem install cocoapods  (pré-installé, causait le crash Ruby 4.0.3)

      - name: Build web app
        script: npm run build

      - name: Capacitor sync iOS
        script: npx cap sync ios

      - name: Install pods
        script: |
          cd ios/App
          pod install

      - name: Setup code signing
        script: |
          xcode-project use-profiles

      - name: Build IPA (Release, signé)
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - narcissemokongi@gmail.com
        notify:
          success: true
          failure: true
      # ✅ Optionnel : upload TestFlight automatique
      # app_store_connect:
      #   auth: integration
      #   submit_to_testflight: true

  desktop-build:
    name: Build Desktop
    max_build_duration: 60
    environment:
      vars:
        NODE_VERSION: "20.19.0"
      node: 20.19.0
      groups:
        - app-env
    scripts:
      - name: Install dependencies
        script: npm ci
      - name: Build web app
        script: npm run build
      - name: Capacitor sync electron
        script: npx cap sync electron
      - name: Package Electron
        script: |
          cd electron
          npm install
          npm run electron:build
    artifacts:
      - electron/release/*.exe
      - electron/release/*.dmg
      - electron/release/*.AppImage
    publishing:
      email:
        recipients:
          - narcissemokongi@gmail.com