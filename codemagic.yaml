workflows:
  android-build:
    name: Build Android
    max_build_duration: 60
    environment:
      vars:
        NODE_VERSION: "22.11.0"
        JAVA_VERSION: 17
        NAPI_RS_FORCE_WASI: "error"
      node: 22.11.0
      java: 17
      groups:
        - app-env
    scripts:
      - name: Install dependencies
        script: |
          set -e
          echo "=== Node: $(node --version) | Arch: $(uname -m) ==="

          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund || true

          if [ ! -f node_modules/vite/bin/vite.js ]; then
            echo "❌ Vite manquant après npm install"; exit 1
          fi

          echo "=== Tentative install WASM binding (flags plateforme) ==="
          npm install --no-save --no-audit --no-fund \
            --cpu=wasm32 --os=wasip1-threads --force \
            @rolldown/binding-wasm32-wasi@1.0.0-rc.17 || true

          if [ ! -d "node_modules/@rolldown/binding-wasm32-wasi" ]; then
            echo "⚠️  Install npm échouée, fallback: extraction manuelle du tarball"
            mkdir -p /tmp/wasm-binding
            cd /tmp/wasm-binding
            npm pack @rolldown/binding-wasm32-wasi@1.0.0-rc.17
            tar -xzf rolldown-binding-wasm32-wasi-1.0.0-rc.17.tgz
            mkdir -p "$CM_BUILD_DIR/node_modules/@rolldown/binding-wasm32-wasi"
            cp -R package/. "$CM_BUILD_DIR/node_modules/@rolldown/binding-wasm32-wasi/"
            cd "$CM_BUILD_DIR"
          fi

          # Force l'installation des dépendances du binding WASM
          echo "=== Installation des dépendances WASM runtime ==="
          npm install --no-save --no-audit --no-fund --force \
            @napi-rs/wasm-runtime@1.1.4 \
            @emnapi/core@1.11.1 \
            @emnapi/runtime@1.11.1 \
            @tybys/wasm-util@0.10.1 || true

          echo "=== Vérification finale ==="
          ls -la node_modules/@rolldown/ 2>/dev/null || true
          if [ ! -d "node_modules/@rolldown/binding-wasm32-wasi" ]; then
            echo "❌ FATAL: binding WASM toujours absent"
            exit 1
          fi
          if [ ! -d "node_modules/@napi-rs/wasm-runtime" ]; then
            echo "❌ FATAL: @napi-rs/wasm-runtime manquant"
            exit 1
          fi
          echo "✅ Binding WASM et dépendances présents"
      - name: Build web app
        script: npm run build
      - name: Capacitor sync
        script: npx cap sync android
      - name: Build APK (debug)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients:
          - narcissemokongi@gmail.com

  ios-build:
    name: Build iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.schoolmanagement.app
      vars:
        NODE_VERSION: "22.11.0"
        XCODE_VERSION: 15.4
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
        NAPI_RS_FORCE_WASI: "error"
      node: 22.11.0
      xcode: 15.4
      cocoapods: default
      groups:
        - app-env
    scripts:
      - name: Install dependencies
        script: |
          set -e
          echo "=== Node: $(node --version) | Arch: $(uname -m) ==="

          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund || true

          if [ ! -f node_modules/vite/bin/vite.js ]; then
            echo "❌ Vite manquant après npm install"; exit 1
          fi

          echo "=== Tentative install WASM binding (flags plateforme) ==="
          npm install --no-save --no-audit --no-fund \
            --cpu=wasm32 --os=wasip1-threads --force \
            @rolldown/binding-wasm32-wasi@1.0.0-rc.17 || true

          if [ ! -d "node_modules/@rolldown/binding-wasm32-wasi" ]; then
            echo "⚠️  Install npm échouée, fallback: extraction manuelle du tarball"
            mkdir -p /tmp/wasm-binding
            cd /tmp/wasm-binding
            npm pack @rolldown/binding-wasm32-wasi@1.0.0-rc.17
            tar -xzf rolldown-binding-wasm32-wasi-1.0.0-rc.17.tgz
            mkdir -p "$CM_BUILD_DIR/node_modules/@rolldown/binding-wasm32-wasi"
            cp -R package/. "$CM_BUILD_DIR/node_modules/@rolldown/binding-wasm32-wasi/"
            cd "$CM_BUILD_DIR"
          fi

          # Force l'installation des dépendances du binding WASM
          echo "=== Installation des dépendances WASM runtime ==="
          npm install --no-save --no-audit --no-fund --force \
            @napi-rs/wasm-runtime@1.1.4 \
            @emnapi/core@1.11.1 \
            @emnapi/runtime@1.11.1 \
            @tybys/wasm-util@0.10.1 || true

          echo "=== Vérification finale ==="
          ls -la node_modules/@rolldown/ 2>/dev/null || true
          if [ ! -d "node_modules/@rolldown/binding-wasm32-wasi" ]; then
            echo "❌ FATAL: binding WASM toujours absent"
            exit 1
          fi
          if [ ! -d "node_modules/@napi-rs/wasm-runtime" ]; then
            echo "❌ FATAL: @napi-rs/wasm-runtime manquant"
            exit 1
          fi
          echo "✅ Binding WASM et dépendances présents"
      - name: Build web app
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Install pods
        script: |
          cd ios/App
          pod install
      - name: Setup code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA (Release, signé)
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - narcissemokongi@gmail.com
        notify:
          success: true
          failure: true

