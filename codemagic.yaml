workflows:
  android-build:
    name: Build Android
    max_build_duration: 60
    environment:
      vars:
        NODE_VERSION: "22.12.0"
        JAVA_VERSION: 17
      node: 22.12.0
      java: 17
      groups:
        - app-env
        - android_signing
    scripts:
      - name: Install dependencies
        script: |
          set -e
          echo "=== Node: $(node --version) | Arch: $(uname -m) | OS: $(uname -s) ==="

          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund || true

          if [ ! -f node_modules/vite/bin/vite.js ]; then
            echo "❌ Vite manquant après npm install"; exit 1
          fi

          # ✅ Détection automatique de l'OS et de l'architecture
          OS=$(uname -s)
          ARCH=$(uname -m)
          BINDING=""

          if [ "$OS" = "Darwin" ]; then
            if [ "$ARCH" = "arm64" ]; then
              BINDING="@rolldown/binding-darwin-arm64@1.0.0-rc.17"
            else
              BINDING="@rolldown/binding-darwin-x64@1.0.0-rc.17"
            fi
          elif [ "$OS" = "Linux" ]; then
            if [ "$ARCH" = "arm64" ]; then
              BINDING="@rolldown/binding-linux-arm64-gnu@1.0.0-rc.17"
            else
              BINDING="@rolldown/binding-linux-x64-gnu@1.0.0-rc.17"
            fi
          fi

          if [ -z "$BINDING" ]; then
            echo "❌ OS/Arch non supporté : $OS / $ARCH"
            exit 1
          fi

          echo "=== Installation du binding pour $OS / $ARCH : $BINDING ==="
          npm install --no-save --no-audit --no-fund --force $BINDING || true

          # Vérification
          BINDING_DIR=$(echo $BINDING | cut -d'@' -f1)
          if [ ! -d "node_modules/$BINDING_DIR" ]; then
            echo "❌ FATAL: $BINDING_DIR absent"
            exit 1
          fi
          echo "✅ Binding présent : $BINDING_DIR"

      - name: Build web app
        script: npm run build

      - name: Capacitor sync
        script: npx cap sync android

      - name: Set up Android keystore
        script: |
          set -e
          echo "=== Décodage du keystore ==="
          echo "$CM_KEYSTORE" | base64 --decode > "$CM_BUILD_DIR/android/app/release.keystore"
          ls -la "$CM_BUILD_DIR/android/app/release.keystore"
          echo "✅ Keystore restauré"

      - name: Build APK (release signé)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleRelease --stacktrace

    artifacts:
      - android/app/build/outputs/apk/release/*.apk
    publishing:
      email:
        recipients:
          - narcissemokongi@gmail.com

  ios-build:
    name: Build iOS
    max_build_duration: 60
    instance_type: mac_mini_m2
    integrations:
      app_store_connect: codemagic
    environment:
      ios_signing:
        distribution_type: app_store
        bundle_identifier: com.schoolmanagement.app
      vars:
        NODE_VERSION: "22.12.0"
        XCODE_VERSION: 15.4
        XCODE_WORKSPACE: "App.xcworkspace"
        XCODE_SCHEME: "App"
      node: 22.12.0
      xcode: 15.4
      cocoapods: default
      groups:
        - app-env
    scripts:
      - name: Install dependencies
        script: |
          set -e
          echo "=== Node: $(node --version) | Arch: $(uname -m) ==="

          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund || true

          if [ ! -f node_modules/vite/bin/vite.js ]; then
            echo "❌ Vite manquant après npm install"; exit 1
          fi

          echo "=== Installation du binding NATIF darwin-arm64 (pour iOS) ==="
          npm install --no-save --no-audit --no-fund --force \
            @rolldown/binding-darwin-arm64@1.0.0-rc.17 || true

          if [ ! -d "node_modules/@rolldown/binding-darwin-arm64" ]; then
            echo "❌ FATAL: binding natif darwin-arm64 absent"
            exit 1
          fi
          echo "✅ Binding natif darwin-arm64 présent"
      - name: Build web app
        script: npm run build
      - name: Capacitor sync iOS
        script: npx cap sync ios
      - name: Install pods
        script: |
          cd ios/App
          pod install
      - name: Setup code signing
        script: |
          xcode-project use-profiles
      - name: Build IPA (Release, signé)
        script: |
          cd ios/App
          xcode-project build-ipa \
            --workspace "$XCODE_WORKSPACE" \
            --scheme "$XCODE_SCHEME"
    artifacts:
      - ios/App/build/ios/ipa/*.ipa
      - /tmp/xcodebuild_logs/*.log
    publishing:
      email:
        recipients:
          - narcissemokongi@gmail.com
        notify:
          success: true
          failure: true

  desktop-build:
    name: Build Desktop
    max_build_duration: 60
    environment:
      vars:
        NODE_VERSION: "22.12.0"
      node: 22.12.0
      groups:
        - app-env
    scripts:
      - name: Install dependencies
        script: |
          set -e
          echo "=== Node: $(node --version) | Arch: $(uname -m) ==="

          rm -rf node_modules package-lock.json
          npm install --no-audit --no-fund || true

          if [ ! -f node_modules/vite/bin/vite.js ]; then
            echo "❌ Vite manquant après npm install"; exit 1
          fi

          echo "=== Installation du binding NATIF darwin-arm64 ==="
          npm install --no-save --no-audit --no-fund --force \
            @rolldown/binding-darwin-arm64@1.0.0-rc.17 || true

          if [ ! -d "node_modules/@rolldown/binding-darwin-arm64" ]; then
            echo "❌ FATAL: binding natif darwin-arm64 absent"
            exit 1
          fi
          echo "✅ Binding natif darwin-arm64 présent"
      - name: Build web app
        script: npm run build
      - name: Capacitor sync electron
        script: npx cap sync electron
      - name: Package Electron
        script: |
          cd electron
          npm install
          npm run electron:make
    artifacts:
      - electron/release/*.exe
      - electron/release/*.dmg
      - electron/release/*.AppImage
    publishing:
      email:
        recipients:
          - narcissemokongi@gmail.com