workflows:
  android-build:
    name: Build Android
    max_build_duration: 60
    environment:
      vars:
        NODE_VERSION: "22.11.0"
        JAVA_VERSION: 17
      node: 22.11.0
      java: 17
      groups:
        - app-env
    scripts:
      - name: Install dependencies
        script: |
          set -e
          rm -rf node_modules
          rm -f package-lock.json
          npm install --no-audit --no-fund
          npm install --no-save --force @rolldown/binding-darwin-arm64@1.2.12 || true
          npm install --no-save --force @rolldown/binding-darwin-universal@1.2.12 || true
          npm install --no-save --force @rolldown/binding-wasm32-wasi@1.2.12 || true
          echo "NAPI_RS_FORCE_WASI=error" >> $CM_ENV
          echo "=== Bindings installés ==="
          ls node_modules/@rolldown/ 2>/dev/null || echo "❌ Aucun binding"
      - name: Build web app
        script: npm run build
      - name: Capacitor sync
        script: npx cap sync android
      - name: Build APK (debug)
        script: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
    artifacts:
      - android/app/build/outputs/apk/debug/app-debug.apk
    publishing:
      email:
        recipients:
          - narcissemokongi@gmail.com